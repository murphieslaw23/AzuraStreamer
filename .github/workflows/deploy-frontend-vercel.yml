name: Deploy frontend (Vercel)

# Ships the static dashboard in public/ to Vercel. REST calls are proxied to the
# IONOS backend by the routes in vercel.json; the Socket.io connection is made
# directly, which is what the generated config.js configures.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'server/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      IS_PRODUCTION: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel configuration
        id: guard
        # Until the Vercel project exists this workflow has nothing to deploy to.
        # Skipping keeps pull requests green instead of failing on absent secrets.
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets are not configured; skipping frontend deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.configured == 'true'
        with:
          node-version: 20
      - name: Install Vercel CLI
        if: steps.guard.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        if: steps.guard.outputs.configured == 'true'
        run: |
          if [ "$IS_PRODUCTION" = "true" ]; then
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          else
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          fi

      - name: Generate frontend configuration
        if: steps.guard.outputs.configured == 'true'
        # AZURA_API_ORIGIN is defined once, in Vercel project settings: the routes
        # in vercel.json expand it per request, and it is read back out here to
        # tell the Socket.io client which origin to dial.
        run: |
          set -euo pipefail
          env_file="$(ls .vercel/.env.*.local 2>/dev/null | head -n1 || true)"
          if [ -z "$env_file" ]; then
            echo "vercel pull produced no environment file" >&2
            exit 1
          fi
          origin="$(grep -E '^AZURA_API_ORIGIN=' "$env_file" | head -n1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//')"
          if [ -z "$origin" ]; then
            echo "AZURA_API_ORIGIN is not set on the Vercel project. Add it in project settings." >&2
            exit 1
          fi
          case "$origin" in
            https://*) ;;
            *) echo "AZURA_API_ORIGIN must be an https:// origin, got: $origin" >&2; exit 1 ;;
          esac
          echo "Socket.io origin: $origin"
          {
            printf '// Generated at deploy time by deploy-frontend-vercel.yml.\n'
            printf 'window.AZURA_CONFIG = {\n'
            printf "  apiOrigin: '%s'\n" "$origin"
            printf '};\n'
          } > public/config.js
          cat public/config.js

      - name: Build
        if: steps.guard.outputs.configured == 'true'
        run: |
          if [ "$IS_PRODUCTION" = "true" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy
        if: steps.guard.outputs.configured == 'true'
        id: deploy
        run: |
          set -euo pipefail
          if [ "$IS_PRODUCTION" = "true" ]; then
            url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          else
            url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke check
        if: steps.guard.outputs.configured == 'true'
        run: curl --fail --show-error --silent --retry 5 --retry-delay 3 --retry-all-errors "${{ steps.deploy.outputs.url }}" >/dev/null
