<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup — SYCO23</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 20px;
      overflow: auto;
    }
    .setup-card {
      position: relative;
      width: 100%;
      max-width: 440px;
      padding: 44px;
      background: var(--iron);
      border: 1px solid var(--line);
      border-radius: 0;
      box-shadow: 7px 7px 0 #0d0d0b;
      animation: fadeIn 0.6s ease-out;
    }
    .setup-card::before { position: absolute; top: 0; left: 0; width: 5px; height: 72px; background: var(--signal); content: ""; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; color: var(--bone); }
    .logo-text { color: var(--bone); font: 700 29px/.95 var(--display); letter-spacing: -.02em; }
    h1 { margin: 0 0 8px; color: var(--bone); font: 700 36px/.95 var(--display); text-transform: uppercase; }
    p { margin: 0 0 32px; color: var(--dust); font-size: 14px; line-height: 1.6; }
    @media (max-width: 430px) { .setup-card { padding: 34px 24px; } }
  </style>
</head>
<body>
  <div class="setup-card">
    <div class="logo">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5H7M19 12H5M17 19H7"/></svg>
      <span class="logo-text">SYCO23</span>
    </div>
    <h1>Welcome</h1>
    <p>Please set your administrator password to initialize the application.</p>
    
    <form id="setup-form">
      <div class="form-group">
        <label class="form-label" for="inp-password">Admin Password</label>
        <input id="inp-password" type="password" class="form-input" placeholder="Min 8 characters" required minlength="8" />
      </div>
      <div class="form-group">
        <label class="form-label" for="inp-confirm">Confirm Password</label>
        <input id="inp-confirm" type="password" class="form-input" placeholder="Repeat your password" required minlength="8" />
      </div>
      <div id="setup-error" class="badge badge--error" role="alert" style="width: 100%; margin-bottom: 20px; justify-content: center;" hidden></div>
      <button type="submit" class="btn btn--primary btn--full">Complete Setup</button>
    </form>
  </div>

  <script>
    const $ = (selector) => document.querySelector(selector);
    const error = $('#setup-error');

    fetch('/api/auth-status').then(response => response.json()).then(data => {
      if (!data.setupRequired) window.location.href = '/login.html';
    });

    $('#setup-form').onsubmit = async (event) => {
      event.preventDefault();
      const password = $('#inp-password').value;
      if (password !== $('#inp-confirm').value) {
        error.textContent = 'Passwords do not match';
        error.hidden = false;
        return;
      }
      try {
        const data = await fetch('/api/setup/admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        }).then(response => response.json());
        if (data.ok) return window.location.assign('/');
        error.textContent = data.error || 'Setup failed';
        error.hidden = false;
      } catch {
        error.textContent = 'Connection error';
        error.hidden = false;
      }
    };
  </script>
</body>
</html>
