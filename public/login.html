<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — SYCO23</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 0;
      overflow: auto;
    }
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      animation: fadeIn 0.6s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-card {
      position: relative;
      background: var(--iron);
      border: 1px solid var(--border);
      border-radius: 0;
      padding: 40px;
      box-shadow: 7px 7px 0 #0d0d0b;
      text-align: left;
    }
    .login-card::before { position: absolute; top: 0; left: 0; width: 5px; height: 72px; background: var(--signal); content: ""; }
    .login-logo {
      width: 38px;
      height: 38px;
      margin: 0 0 24px;
      color: var(--bone);
    }
    .login-title {
      margin: 0 0 8px;
      color: var(--bone);
      font: 700 36px/.95 var(--display);
      letter-spacing: -.02em;
      text-transform: uppercase;
    }
    .login-sub {
      color: var(--dust);
      font: 500 10px/1.4 var(--mono);
      letter-spacing: .14em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    .error-msg {
      background: var(--oil);
      color: #db8c84;
      padding: 10px;
      border-radius: 0;
      font-size: 13px;
      margin-bottom: 20px;
      border: 1px solid var(--fault);
      display: none;
    }
    .login-links { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); display: flex; gap: 20px; }
    .login-links a { color: var(--dust); text-decoration: none; font-size: 12px; font-weight: 500; }
    .login-links a:hover { color: var(--bone); }
    @media (max-width: 430px) { .login-card { padding: 32px 24px; } }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 2v28M23 7H9M26 16H6M23 25H9" stroke="currentColor" stroke-width="2.4"/>
        </svg>
      </div>
      <h1 class="login-title">SYCO23</h1>
      <p class="login-sub">Authorized Personnel Only</p>
      
      <div id="login-error" class="error-msg" role="alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="inp-password" style="text-align: left;">System Password</label>
          <input type="password" id="inp-password" class="form-input" placeholder="••••••••" required autofocus>
        </div>
        <button type="submit" class="btn btn--primary btn--full">Access Dashboard</button>
      </form>

      <div class="login-links">
        <a href="/privacy.html">Privacy Policy</a>
        <a href="/terms.html">Terms of Use</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const error = document.getElementById('login-error');

    fetch('/api/auth-status').then(response => response.json()).then(data => {
      if (data.setupRequired) window.location.href = '/setup.html';
    });

    form.onsubmit = async (event) => {
      event.preventDefault();
      error.style.display = 'none';
      const password = document.getElementById('inp-password');
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: password.value }),
        });
        const data = await response.json();
        if (data.ok) return window.location.assign('/');
        error.textContent = data.error || 'Login failed';
        error.style.display = 'block';
        password.value = '';
        password.focus();
      } catch {
        error.textContent = 'Connection error. Is the server running?';
        error.style.display = 'block';
      }
    };
  </script>
</body>
</html>
