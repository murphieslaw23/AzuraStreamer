services:
  azurastreamer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: azurastreamer
    restart: unless-stopped
    # Removed host port exposure - will be accessed via reverse proxy
    # ports:
    #   - "0.0.0.0:3000:3000"
    expose:
      - "3000"  # Expose internally for reverse proxy
    environment:
      PORT: "3000"
      NODE_ENV: "production"
      # Required in production. Generate with: openssl rand -hex 32
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env before starting}
      # Leave empty for this all-in-one deployment, where this process also serves
      # the UI. Only a split deployment (UI on a separate host) sets it.
      PUBLIC_APP_ORIGINS: ${PUBLIC_APP_ORIGINS:-}
      AZURACAST_API_URL: ${AZURACAST_API_URL}
      AZURACAST_API_KEY: ${AZURACAST_API_KEY}
    volumes:
      # Persist stream temp data outside the container
      - azurastreamer_tmp:/tmp/azurastreamer
      # Persist database
      - ./data:/app/data
    # Allow ffmpeg to spawn child processes
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', function (r) { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', function () { process.exit(1); })\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - syco23-proxy

networks:
  syco23-proxy:
    external: true

volumes:
  azurastreamer_tmp:
    driver: local
